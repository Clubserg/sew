	<main>
		<h2>Meteorologia de MotoGP Desktop</h2>

		<!-- Contenedor para información de la ciudad -->
		<section>
			<h3>Información del Circuito</h3>
		</section>

		<!-- Contenedor para datos meteorológicos de la carrera -->

			<h3>Meteorología del Día de la Carrera</h3>
		</section>

			<h3>Meteorología de los Entrenamientos</h3>
		</section>

	<script>
		const ciudad = new Ciudad("Austin", "Estados Unidos", "austinense");
		ciudad.establecerSecundarios(974000, 30.2672, -97.7431);
	
		// Crear la información de la ciudad usando jQuery
		const $article = $("<article></article>");
	
		const $h4 = $("<h4></h4>").text(ciudad.getNombre());
		$article.append($h4);
	
		const $pPais = $("<p></p>").html("<strong>País:</strong> " + ciudad.getPais());
		$article.append($pPais);
	
		$article.append(ciudad.infoSecundariaHTML());
		$article.append(ciudad.escribirCoordenadas());
	
		$("main > section:first-of-type").append($article);

		// Obtener datos meteorológicos de la carrera
		// Fecha de ejemplo: GP de las Américas 2024
		ciudad.getMeteorologiaCarrera();

		// Obtener datos meteorológicos de entrenamientos
		// 3 días previos a la carrera
		ciudad.getMeteorologiaEntrenos("2025-10-16", "2025-10-18");
	</script>
