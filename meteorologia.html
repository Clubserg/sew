	<h2>Meteorologia de MotoGP Desktop</h2>

	
	<script>
		const ciudad = new Ciudad("Austin", "Estados Unidos", "austinense");
		ciudad.establecerSecundarios(974000, 30.2672, -97.7431);
	
		const article = document.createElement("article");
	
		const h3 = document.createElement("h3");
		h3.textContent = ciudad.getNombre();
		article.appendChild(h3);
	
		const pPais = document.createElement("p");
		pPais.innerHTML = `<strong>País:</strong> ${ciudad.getPais()}`;
		article.appendChild(pPais);
	
		const listaInfo = document.createElement("div");
		listaInfo.innerHTML = ciudad.infoSecundariaHTML();
		article.appendChild(listaInfo);
	
		const coords = document.createElement("div");
		coords.innerHTML = ciudad.escribirCoordenadas();
		article.appendChild(coords);
	
		document.body.appendChild(article);
	</script>

	<noscript>
		<p><em>Necesitas activar JavaScript para ver la información de la ciudad.</em></p>
