	<h2>Meteorologia de MotoGP Desktop</h2>

	
	<script>
		// Instancia de la clase Ciudad correspondiente a Circuit of the Americas → Austin (Estados Unidos)
		// Constructor: nombre, país, gentilicio
		const ciudad = new Ciudad("Austin", "Estados Unidos", "austinense");

		// Completar atributos: población y coordenadas del centro (latitud, longitud)
		// Puedes ajustar población si tu práctica usa otro dato concreto.
		ciudad.establecerSecundarios(974000, 30.2672, -97.7431);


		document.write(`<article class="bloque-ciudad">`);
		document.write(`<h3>${ciudad.getNombre()}</h3>`);
		document.write(`<p><strong>País:</strong> ${ciudad.getPais()}</p>`);
		// Lista no ordenada con gentilicio y población
		document.write(ciudad.infoSecundariaHTML());
		// Coordenadas usando el método que internamente utiliza document.write()
		ciudad.escribirCoordenadas();
		document.write(`</article>`);
	</script>

		<p><em>Necesitas activar JavaScript para ver la información de la ciudad.</em></p>
